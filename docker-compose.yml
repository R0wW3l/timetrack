services:
  timetrack:
    image: rwel/timetrack:latest
    build: .
    container_name: timetrack
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: "${SETTINGS_FOLDER:-${HOME}/.timetrack}"
        target: /settings
      - type: bind
        source: "${DATA_FOLDER:-${HOME}/timetrack-data}"
        target: /data
      - type: bind
        source: "${DATA_MOUNT:-${DATA_FOLDER:-${HOME}/timetrack-data}}"
        target: "${DATA_MOUNT:-${DATA_FOLDER:-${HOME}/timetrack-data}}"
    environment:
      - SETTINGS_FOLDER=/settings
      - DATA_FOLDER=/data
      - PORT=8080
      - TZ=America/Edmonton
