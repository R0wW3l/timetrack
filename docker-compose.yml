services:
  timetrack:
    image: rwel/timetrack:latest
    build: .
    container_name: timetrack
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: "${DATA_FOLDER:-${HOME}/timetrack-data}"
        target: /data
    environment:
      - DATA_FOLDER=/data
      - PORT=8080
      - TZ=America/Edmonton
